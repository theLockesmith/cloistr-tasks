stages:
  - update
  - test
  - build
  - smoke

variables:
  NODE_VERSION: "22"

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/frontend-smoke.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/cloistr-rules.yml'

# Auto-update @cloistr/ui when triggered from upstream
update-dependency:
  stage: update
  image: node:${NODE_VERSION}-alpine
  rules:
    - if: '$UPSTREAM_TRIGGER == "true"'
  before_script:
    - apk add --no-cache git openssh-client
    - git config --global user.email "ci@coldforge.xyz"
    - git config --global user.name "GitLab CI"
  script:
    - cd frontend
    - echo "Updating ${UPSTREAM_PACKAGE}..."
    - npm update ${UPSTREAM_PACKAGE}
    - |
      if git diff --quiet package-lock.json; then
        echo "No changes to lockfile, already up to date"
      else
        echo "Lockfile updated, committing..."
        git add package-lock.json package.json
        git commit -m "chore: Update ${UPSTREAM_PACKAGE} [auto]"
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_REF_NAME}
      fi

# Run the frontend unit tests. Until now this repo had no test stage at all, so
# `npm test` (52 vitest tests, three files) had never executed in CI once. The
# gate that mattered most was the one that did not exist: the 12 tests in
# src/tests/authGate.test.js were written specifically to discriminate the auth
# regression fixed in 87dd901c (5 of them fail against the previous logic) and
# they went in behind a green pipeline that never ran them.
#
# `extends: .cloistr-rules` is REQUIRED, not decorative. Without it this job is
# silently dropped from every merge-request pipeline. See cloistr-rules.yml.
#
# Image and install flags mirror frontend/Dockerfile exactly (node:22.23.2-alpine,
# `npm ci --legacy-peer-deps`). That pairing is verified against this lockfile:
# CI's npm is 10.9.8 and npm 10 rejects lockfiles that omit optional peer deps,
# which is the deadlock that held docs/sheets/whiteboard on a stale bundle for a
# week. Do not "simplify" this to node:22 + plain `npm ci`.
test:frontend:
  extends: .cloistr-rules
  stage: test
  image: node:22.23.2-alpine
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm test

build:backend:
  extends: .kaniko-build
  stage: build
  variables:
    KANIKO_CONTEXT_SUBDIR: "/backend"
    KANIKO_DOCKERFILE_SUBPATH: "/backend/Dockerfile"
    KANIKO_IMAGE: "$CI_REGISTRY_IMAGE/backend"

build:frontend:
  extends: .kaniko-build
  stage: build
  variables:
    KANIKO_CONTEXT_SUBDIR: "/frontend"
    KANIKO_DOCKERFILE_SUBPATH: "/frontend/Dockerfile"
    KANIKO_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

# Smoke-test: load frontend image in real Chromium, fail on console errors / blank page
smoke-test:
  extends: .smoke-test
  needs: ["build:frontend"]
  variables:
    SMOKE_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
